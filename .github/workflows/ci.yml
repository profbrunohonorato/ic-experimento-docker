name: CI/CD - Docker e Self-hosted Runner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# O catálogo e seus scanners não precisam escrever no repositório.
permissions:
  contents: read

jobs:
  qualidade:
    name: github-qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Fixar npm validado na aula
        run: npm install --global npm@11.21.1
      - run: npm ci
      - run: npm run lint
      # Coverage também executa os testes; evita rodar a mesma suíte duas vezes.
      - run: npm run coverage
      # SonarQube comentado para manter o foco nos controles desta aula.
      # Antes de reativar: descomentar sonar-project.properties, configurar secrets
      # e fixar a action em um SHA verificado.
      # - name: SonarQube
      #   uses: SonarSource/sonarqube-scan-action@v7
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cobertura
          path: coverage/
          retention-days: 7

  sast:
    name: github-sast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install semgrep==1.182.0
      - name: SAST - bloquear padrões inseguros
        run: |
          mkdir -p reports
          semgrep scan --config .semgrep.yml --error --strict --metrics=off --disable-version-check --json --output reports/semgrep.json src
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sast
          path: reports/semgrep.json
          retention-days: 7

  sca:
    name: github-sca
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Fixar npm validado na aula
        run: npm install --global npm@11.21.1
      - run: npm ci
      - name: SCA - bloquear vulnerabilidades altas e críticas
        run: |
          mkdir -p reports
          npm audit --audit-level=high --json > reports/npm-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependencias
          path: reports/npm-audit.json
          retention-days: 7

  segredos:
    name: github-segredos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Gitleaks deve enxergar o histórico, não só o último commit.
          persist-credentials: false
      - name: Instalar Gitleaks com versão e checksum fixados
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Secret scanning - histórico Git
        run: |
          mkdir -p reports
          /tmp/gitleaks git --config .gitleaks.toml --redact --exit-code 1 --report-format json --report-path reports/gitleaks.json .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: segredos
          path: reports/gitleaks.json
          retention-days: 7

  build:
    name: github-build
    # Este needs é o Security Gate. Falha ou cancelamento impede o build.
    needs: [qualidade, sast, sca, segredos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Fixar npm validado na aula
        run: npm install --global npm@11.21.1
      - run: npm ci
      - run: npm run build
      - name: Inventário de componentes (SBOM)
        run: |
          mkdir -p reports
          npm sbom --sbom-format cyclonedx > reports/sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalogo-e-sbom
          path: |
            dist/
            reports/sbom.cdx.json
          retention-days: 7

  docker-build:
    name: github-docker-build
    # Só constrói a imagem depois do build React aprovado (que já depende do Security Gate).
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construir imagem
        run: docker build -t catalogo:1.0 .
      - name: Testar contêiner (smoke test)
        run: |
          docker run -d --name catalogo-teste -p 127.0.0.1:8080:80 catalogo:1.0
          for tentativa in $(seq 1 10); do
            curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null && break
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q '<div id="root">'
          docker rm -f catalogo-teste
      - name: Exportar imagem
        run: docker save -o catalogo.tar catalogo:1.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: imagem-catalogo
          path: catalogo.tar
          retention-days: 7

  deploy:
    name: self-hosted-deploy
    needs: [docker-build]
    # Nunca executar código de pull request no runner da máquina local:
    # somente push (ou execução manual) na main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    # Um deploy por vez; um novo push espera o anterior terminar.
    concurrency:
      group: deploy-catalogo
      cancel-in-progress: false
    environment:
      name: local
      url: http://localhost:${{ vars.CATALOGO_PORTA || '8080' }}
    env:
      CATALOGO_PORTA: ${{ vars.CATALOGO_PORTA || '8080' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verificar Docker no runner
        run: |
          docker version --format 'Docker Engine {{.Server.Version}}'
          docker compose version
      - name: Implantar aplicação
        # --wait aguarda o healthcheck do compose.yaml ficar "healthy".
        run: docker compose up -d --build --wait
      - name: Verificar aplicação publicada
        run: |
          docker compose ps
          curl --fail --silent --show-error "http://127.0.0.1:${CATALOGO_PORTA}/" | grep -q '<div id="root">'
          echo "Catálogo disponível em http://localhost:${CATALOGO_PORTA}"
      - name: Remover imagens sem referência
        if: always()
        run: docker image prune -f
